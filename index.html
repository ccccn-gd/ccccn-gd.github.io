<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>合成孟令行</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#1a1a2e;
  overflow:hidden;
  touch-action:none;
  font-family:system-ui;
}
#gameWrap{
  width:100vw;
  height:100vh;
  position:relative;
}
#gameCanvas{
  width:100vw;
  height:100vh;
  display:block;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal-box{
  background:#fff;
  padding:24px;
  border-radius:16px;
  text-align:center;
  width:80%;
  max-width:320px;
}
.modal-img{
  width:100%;
  border-radius:12px;
  margin-bottom:12px;
  display:block;
}
.modal-box h2{
  margin-bottom:8px;
  font-size:22px;
}
.modal-box p{
  color:#444;
  margin-bottom:16px;
}
.modal-box button{
  padding:10px 24px;
  border:none;
  background:#2563eb;
  color:white;
  border-radius:8px;
  font-size:16px;
}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="gameCanvas"></canvas>

  <!-- 胜利弹窗 -->
  <div class="modal" id="winModal">
    <div class="modal-box">
      <div id="winImgBox"></div>
      <h2>🎉 洗上澡啦！</h2>
      <p>孟令行说谢谢！</p >
      <button onclick="restartGame()">再来一局</button>
    </div>
  </div>

  <!-- 失败弹窗 -->
  <div class="modal" id="loseModal">
    <div class="modal-box">
      <div id="loseImgBox"></div>
      <h2>💥 还是做不到吗</h2>
      <p>球体堆得太高啦！</p >
      <button onclick="restartGame()">重新开始</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 弹窗图片预加载
const winImg = new Image();
winImg.src = "win.jpg";
const loseImg = new Image();
loseImg.src = "lose.jpg";
winImg.className = "modal-img";
loseImg.className = "modal-img";
document.getElementById("winImgBox").appendChild(winImg);
document.getElementById("loseImgBox").appendChild(loseImg);

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

const levels = [
  { r:22,  src:"photo1.jpg" },
  { r:32,  src:"photo2.jpg" },
  { r:42,  src:"photo3.jpg" },
  { r:52,  src:"photo4.jpg" },
  { r:64,  src:"photo5.jpg" },
  { r:76,  src:"photo6.jpg" },
  { r:88,  src:"photo7.jpg" },
  { r:100, src:"photo8.jpg" },
  { r:115, src:"photo9.jpg" }
];

const gravity = 0.32;
const bounce = 0.45;
const failLineRatio = 0.08;

const imgs = levels.map(item=>{
  const img = new Image();
  img.src = item.src;
  return img;
});

let balls = [];
let currentLevel = 0;
let gameOver = false;
let clickCount = 0;
let previewY = 60;
let previewX;

class Ball{
  constructor(x,y,lv){
    this.x = x;
    this.y = y;
    this.lv = lv;
    this.r = levels[lv].r;
    this.vy = 0;
    this.vx = 0;
  }
  update(){
    this.vy += gravity;
    this.x += this.vx;
    this.y += this.vy;

    if(this.x - this.r < 0){
      this.x = this.r;
      this.vx *= -bounce;
    }
    if(this.x + this.r > canvas.width){
      this.x = canvas.width - this.r;
      this.vx *= -bounce;
    }
    if(this.y + this.r > canvas.height){
      this.y = canvas.height - this.r;
      this.vy *= -bounce;
      if(Math.abs(this.vy)<1) this.vy=0;
    }
  }
  draw(){
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.clip();
    const img = imgs[this.lv];
    if(img && img.complete){
      ctx.drawImage(img,this.x-this.r,this.y-this.r,this.r*2,this.r*2);
    }else{
      ctx.fillStyle="#6366f1";
      ctx.beginPath();
      ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function getNextLevel(){
  if(clickCount === 0 || clickCount === 1){
    return 0;
  }else if(clickCount === 2 || clickCount === 3){
    return 1;
  }else if(clickCount === 4){
    return 2;
  }else if(clickCount === 5){
    return 3;
  }else if(clickCount === 6){
    return 4;
  }else{
    return Math.floor(Math.random()*4);
  }
}

function drawPreview(){
  if(gameOver) return;

  const lv = currentLevel;
  const r = levels[lv].r;
  const x = previewX;
  const y = previewY;

  const failY = canvas.height * failLineRatio;
  const bottom = y + r;
  const drawY = bottom > failY ? failY - r : y;

  ctx.save();
  ctx.beginPath();
  ctx.arc(x, drawY, r, 0, Math.PI * 2);
  ctx.clip();

  const img = imgs[lv];
  if(img && img.complete){
    ctx.drawImage(img, x - r, drawY - r, r * 2, r * 2);
  }else{
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.arc(x, drawY, r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();

  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.arc(x, drawY, r + 6, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
}

function collide(b1,b2){
  const dx = b1.x - b2.x;
  const dy = b1.y - b2.y;
  const dist = Math.hypot(dx,dy);
  return dist <= b1.r + b2.r;
}

function handleCollision(){
  for(let i=0;i<balls.length;i++){
    for(let j=i+1;j<balls.length;j++){
      const a = balls[i];
      const b = balls[j];
      if(!collide(a,b)) continue;

      if(a.lv === b.lv){
        const newLv = a.lv + 1;
        if(newLv >= levels.length){
          showWin();
          return;
        }
        const nx = (a.x + b.x)/2;
        const ny = (a.y + b.y)/2;
        balls.splice(j,1);
        balls.splice(i,1);
        balls.push(new Ball(nx, ny, newLv));
        return;
      }

      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.hypot(dx,dy);
      const overlap = (a.r + b.r) - dist;
      const sepX = dx/dist * overlap*0.5;
      const sepY = dy/dist * overlap*0.5;
      a.x += sepX;
      b.x -= sepX;
      a.y += sepY;
      b.y -= sepY;

      const vx1 = a.vx, vy1 = a.vy;
      a.vx = b.vx * bounce;
      a.vy = b.vy * bounce;
      b.vx = vx1 * bounce;
      b.vy = vy1 * bounce;
    }
  }
}

function checkLose(){
  if(balls.length === 0) return;
  const failY = canvas.height * failLineRatio;
  for(let b of balls){
    const threeQuarterPos = b.y + 0.5 * b.r;
    if(threeQuarterPos < failY){
      showLose();
      return;
    }
  }
}

function showWin(){
  gameOver = true;
  document.getElementById('winModal').style.display = 'flex';
}

function showLose(){
  gameOver = true;
  document.getElementById('loseModal').style.display = 'flex';
}

function dropBall(x){
  if(gameOver) return;

  clickCount += 1;
  balls.push(new Ball(x, 100, currentLevel));
  currentLevel = getNextLevel();
}

canvas.addEventListener('touchstart',e=>{
  if(gameOver) return;
  e.preventDefault();
  const touch = e.touches[0];
  const clickX = touch.clientX;
  previewX = clickX;
  dropBall(clickX);
},{passive:false});

canvas.addEventListener('mousedown',e=>{
  if(gameOver) return;
  previewX = e.clientX;
  dropBall(e.clientX);
});

function restartGame(){
  balls = [];
  gameOver = false;
  clickCount = 0;
  currentLevel = getNextLevel();
  previewX = canvas.width / 2;
  document.getElementById('winModal').style.display = 'none';
  document.getElementById('loseModal').style.display = 'none';
}

function loop(){
  if(previewX === undefined) previewX = canvas.width / 2;

  ctx.fillStyle = "#1a1a2e";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const failY = canvas.height * failLineRatio;
  ctx.strokeStyle = "#ef4444";
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(0, failY);
  ctx.lineTo(canvas.width, failY);
  ctx.stroke();
  ctx.setLineDash([]);

  drawPreview();

  if(!gameOver){
    for(let b of balls) b.update();
    handleCollision();
    checkLose();
  }

  for(let b of balls) b.draw();

  requestAnimationFrame(loop);
}

currentLevel = getNextLevel();
loop();
</script>
</body>
</html>
